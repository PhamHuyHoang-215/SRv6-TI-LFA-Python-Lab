
name: srv6-fw

topology:
  defaults:
    kind: linux
    image: srv6-tilfa-base:0.1
    cmd: sleep infinity

  nodes:
    h1: {}
    h2: {}
    r1: {}
    r2: {}
    r3: {}
    r4: {}
    r5: {}
    fw: {}

  links:
    - endpoints: ["h1:eth1", "r1:eth3"]
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r5:eth1"]

    # Bypass
    - endpoints: ["r5:eth2", "r4:eth2"]

    - endpoints: ["r4:eth3", "h2:eth1"]

    # Firewall waypoint
    - endpoints: ["r5:eth3", "fw:eth1"]
    - endpoints: ["fw:eth2", "r4:eth4"]
